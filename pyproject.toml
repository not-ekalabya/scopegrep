[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopegrep"
version = "0.3.1"
description = "Attention-scored context retrieval over a declared repo scope, served by a scale-to-zero Qwen3.5-9B Modal GPU app."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ekalabya Ghosh", email = "ekalabya2010@gmail.com" }]
requires-python = ">=3.10"
keywords = ["retrieval", "context", "search", "attention", "mcp", "modal", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/not-ekalabya/scopegrep"
Changelog = "https://github.com/not-ekalabya/scopegrep/blob/main/CHANGELOG.md"

# Two entry points. `scopegrep-server` is what a `pip install scopegrep`
# gives you on PATH -- the plugin's own `.mcp.json` does NOT use this; it
# invokes src/scopegrep/server.py directly via `uv run --with mcp --with
# httpx`, which resolves those two dependencies on the fly and needs no
# install step at all. Both paths run the identical file; pick whichever
# suits how you got the code.
[project.scripts]
scopegrep-server = "scopegrep.server:main"
scopegrep-prewarm = "scopegrep.prewarm:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopegrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
